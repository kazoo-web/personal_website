<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Katherine Ullman</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            background: #E9E9EB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .phone {
            width: 100%;
            max-width: 460px;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .chat-header {
            padding: 14px 16px 12px;
            border-bottom: 0.5px solid rgba(0,0,0,0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .header-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            background: #ddd;
        }

        .header-name  { font-size: 13px; font-weight: 600; color: #000; }
        .header-sub   { font-size: 11px; color: #8E8E93; margin-top: -3px; }

        /* Messages */
        .messages {
            flex: 1;
            padding: 16px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .row.mine { flex-direction: row-reverse; }

        .av {
            width: 26px; height: 26px; flex-shrink: 0;
        }
        .av img {
            width: 26px; height: 26px; border-radius: 50%;
            object-fit: cover; object-position: center top;
            display: block; background: #ddd;
        }

        .bubble {
            max-width: 75%;
            padding: 9px 14px;
            font-size: 16px;
            line-height: 1.45;
            word-break: break-word;
        }
        .bubble.theirs {
            background: #E9E9EB; color: #000;
            border-radius: 18px 18px 18px 5px;
        }
        .bubble.mine {
            background: #007AFF; color: #fff;
            border-radius: 18px 18px 5px 18px;
        }
        .bubble a { color: inherit; text-decoration: underline; opacity: 0.88; }

        /* Typing dots */
        .typing {
            background: #E9E9EB;
            border-radius: 18px 18px 18px 5px;
            padding: 11px 16px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .dot {
            width: 7px; height: 7px;
            background: #8E8E93; border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.18s; }
        .dot:nth-child(3) { animation-delay: 0.36s; }
        @keyframes bounce {
            0%, 55%, 100% { transform: translateY(0); }
            27%            { transform: translateY(-5px); }
        }

        /* Quick replies */
        .quick-replies {
            padding: 10px 12px 28px;
            border-top: 0.5px solid rgba(0,0,0,0.1);
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .qr {
            padding: 8px 15px;
            border-radius: 17px;
            border: 1.5px solid #007AFF;
            background: transparent;
            color: #007AFF;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .qr:hover  { background: rgba(0,122,255,0.07); }
        .qr:active { background: #007AFF; color: #fff; }
    </style>
</head>
<body>
<div class="phone">

    <header class="chat-header">
        <img src="../headshot.png" alt="KU" class="header-avatar">
        <div class="header-name">Katherine Ullman</div>
        <div class="header-sub">Operations &amp; People Strategy</div>
    </header>

    <!-- Initial greeting baked into HTML — visible without JS -->
    <div class="messages" id="messages">
        <div class="row" id="greeting-row">
            <div class="av"><img src="../headshot.png" alt=""></div>
            <div class="bubble theirs">Hi! 👋 What brings you here today?</div>
        </div>
    </div>

    <!-- Topic buttons baked into HTML -->
    <div class="quick-replies" id="qr-bar">
        <button class="qr" data-topic="about">Who are you?</button>
        <button class="qr" data-topic="work">What kind of work do you do?</button>
        <button class="qr" data-topic="together">I'd like to work with you</button>
        <button class="qr" data-topic="reading">What are you reading?</button>
        <button class="qr" data-topic="projects">Show me something you've built</button>
    </div>

</div>
<script>
var AVATAR = '../headshot.png';
var msgs  = document.getElementById('messages');
var qrBar = document.getElementById('qr-bar');
var busy  = false;

var TOPICS = {
    about: [
        "I grew up between families of artists and scientists — which probably explains why I get as excited about a well-crafted sentence as a well-structured decision.",
        "My work is about building organizations that actually work. Not in theory — under pressure, with real constraints, across people who don't always agree.",
        "Most recently VP of Operations at Electrified Thermal Solutions, a climate tech startup. Before that, five years at Paradigm, a strategy consulting firm.",
        "My academic background is in organizational sociology — I started a PhD at UC Berkeley's Haas before leaving to do the work directly."
    ],
    work: [
        "I work at the intersection of organizational design, people strategy, and operations.",
        "The core question I keep returning to: how do we build organizations that actually work toward their missions?",
        "Lately that's meant working with mission-driven orgs navigating growth phases, team design, operating rhythms, that kind of thing."
    ],
    together: [
        "I'm glad to hear it — I'm selectively available for consulting with mission-driven organizations.",
        "I focus on org design, people strategy, and operational infrastructure, especially during growth or transition.",
        {link: "https://www.linkedin.com/in/katherineullman/", text: "Best way to reach me is on LinkedIn →"}
    ],
    reading: [
        "Right now: Flesh by David Szalay — it just won the Booker Prize and absolutely deserved it.",
        "Also working through Rachel Cusk's Coventry and Sallie Tisdale's Violation.",
        "On podcasts: a lot of Ezra Klein Show and Hard Fork lately."
    ],
    projects: [
        "Happy to — most of what I build is things I actually wanted to exist.",
        "There's a baby betting pool app, a few data projects, a photo gallery... a mix of practical and just-for-fun.",
        "I'm putting together a proper showcase. Check back soon — or find me on LinkedIn in the meantime."
    ]
};

function addRow(content, side, showAv) {
    var row = document.createElement('div');
    row.className = 'row' + (side === 'mine' ? ' mine' : '');

    if (side === 'theirs') {
        var av = document.createElement('div');
        av.className = 'av';
        if (showAv) {
            var img = document.createElement('img');
            img.src = AVATAR; img.alt = '';
            av.appendChild(img);
        }
        row.appendChild(av);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble ' + side;

    if (content && content.link) {
        var a = document.createElement('a');
        a.href = content.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = content.text;
        bubble.appendChild(a);
    } else {
        bubble.textContent = content;
    }

    row.appendChild(bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
}

function addTypingRow() {
    var row = document.createElement('div');
    row.className = 'row';
    var av = document.createElement('div');
    av.className = 'av';
    var img = document.createElement('img');
    img.src = AVATAR; img.alt = '';
    av.appendChild(img);
    row.appendChild(av);
    var t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(t);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
}

function playResponses(responses, idx, done) {
    if (idx >= responses.length) { done(); return; }
    var tr = addTypingRow();
    setTimeout(function() {
        tr.remove();
        addRow(responses[idx], 'theirs', idx === responses.length - 1);
        setTimeout(function() {
            playResponses(responses, idx + 1, done);
        }, 300);
    }, 900 + Math.floor(Math.random() * 300));
}

function handleTopic(id) {
    if (busy) return;
    busy = true;
    qrBar.style.display = 'none';

    var label = qrBar.querySelector('[data-topic="' + id + '"]').textContent;
    addRow(label, 'mine', false);

    setTimeout(function() {
        playResponses(TOPICS[id], 0, function() {
            setTimeout(function() {
                var tr = addTypingRow();
                setTimeout(function() {
                    tr.remove();
                    addRow("Anything else you'd like to know?", 'theirs', false);
                    setTimeout(function() {
                        busy = false;
                        qrBar.style.display = 'flex';
                    }, 350);
                }, 750);
            }, 600);
        });
    }, 500);
}

// Wire up buttons
var btns = qrBar.querySelectorAll('.qr');
for (var i = 0; i < btns.length; i++) {
    (function(btn) {
        btn.addEventListener('click', function() {
            handleTopic(btn.getAttribute('data-topic'));
        });
    })(btns[i]);
}
</script>
</body>
</html>
