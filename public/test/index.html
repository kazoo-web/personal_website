<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Katherine Ullman</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            background: #E9E9EB;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        /* Phone-width container, centered on desktop */
        .phone {
            width: 100%;
            max-width: 460px;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ── Header ── */
        .chat-header {
            padding: 14px 16px 12px;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0,0,0,0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
        }

        .header-name {
            font-size: 13px;
            font-weight: 600;
            color: #000;
            letter-spacing: -0.01em;
        }

        .header-sub {
            font-size: 11px;
            color: #8E8E93;
            margin-top: -3px;
        }

        /* ── Messages ── */
        .messages {
            flex: 1;
            padding: 16px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
        }

        /* Spacer at top so first message doesn't feel flush */
        .messages::before {
            content: '';
            flex: 1;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            animation: pop-in 0.22s ease forwards;
        }

        .message-row.from-me {
            flex-direction: row-reverse;
        }

        @keyframes pop-in {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0)  scale(1); }
        }

        .avatar-slot {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        .avatar-slot img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .bubble {
            max-width: 75%;
            padding: 9px 14px;
            font-size: 16px;
            line-height: 1.45;
            word-break: break-word;
        }

        .bubble.theirs {
            background: #E9E9EB;
            color: #000;
            border-radius: 18px 18px 18px 5px;
        }

        /* Continuation bubbles (not last in a run) get flat corners on the tail side */
        .message-row.cont .bubble.theirs {
            border-radius: 5px 18px 18px 5px;
        }

        .bubble.mine {
            background: #007AFF;
            color: #fff;
            border-radius: 18px 18px 5px 18px;
        }

        .bubble a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
            opacity: 0.88;
        }

        /* Typing indicator */
        .typing-bubble {
            background: #E9E9EB;
            border-radius: 18px 18px 18px 5px;
            padding: 11px 16px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #8E8E93;
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.18s; }
        .dot:nth-child(3) { animation-delay: 0.36s; }

        @keyframes bounce {
            0%, 55%, 100% { transform: translateY(0); }
            27%           { transform: translateY(-5px); }
        }

        /* ── Quick replies ── */
        .quick-replies {
            padding: 10px 12px 28px;
            padding-bottom: max(28px, env(safe-area-inset-bottom));
            border-top: 0.5px solid rgba(0,0,0,0.1);
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .qr-btn {
            padding: 8px 15px;
            border-radius: 17px;
            border: 1.5px solid #007AFF;
            background: transparent;
            color: #007AFF;
            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.12s, color 0.12s;
        }

        .qr-btn:hover  { background: rgba(0,122,255,0.07); }
        .qr-btn:active { background: #007AFF; color: #fff; }
    </style>
</head>
<body>
<div class="phone">

    <header class="chat-header">
        <img src="../headshot.png" alt="Katherine Ullman" class="header-avatar">
        <div class="header-name">Katherine Ullman</div>
        <div class="header-sub">Operations &amp; People Strategy</div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="quick-replies" id="quick-replies" style="display:none;"></div>

</div>
<script>
const AVATAR = '../headshot.png';

const TOPICS = [
    {
        id: 'about',
        label: 'Who are you?',
        responses: [
            "I grew up between families of artists and scientists — which probably explains why I get as excited about a well-crafted sentence as a well-structured decision.",
            "My work is about building organizations that actually work. Not in theory — under pressure, with real constraints, across people who don't always agree.",
            "Most recently VP of Operations at Electrified Thermal Solutions, a climate tech startup. Before that, five years at Paradigm, a strategy consulting firm.",
            "My academic background is in organizational sociology — I started a PhD at UC Berkeley's Haas before leaving to do the work directly. Never felt like the wrong call.",
        ]
    },
    {
        id: 'work',
        label: 'What kind of work do you do?',
        responses: [
            "I work at the intersection of organizational design, people strategy, and operations.",
            "The core question I keep returning to: how do we build organizations that actually work toward their missions?",
            "I'm most interested in the places where strategy, people, and operations all have to move together — and usually aren't.",
            "Lately that's meant working with mission-driven orgs navigating growth phases, team design, operating rhythms, that kind of thing.",
        ]
    },
    {
        id: 'together',
        label: "I'd like to work with you",
        responses: [
            "I'm glad to hear it — I'm selectively available for consulting with mission-driven organizations.",
            "I focus on org design, people strategy, and operational infrastructure, especially during growth or transition.",
            { link: true, text: "Best way to reach me is on LinkedIn →", href: "https://www.linkedin.com/in/katherineullman/" }
        ]
    },
    {
        id: 'reading',
        label: "What are you reading?",
        responses: [
            "Right now: Flesh by David Szalay — it just won the Booker Prize and absolutely deserved it.",
            "Also working through Rachel Cusk's essay collection Coventry, and Sallie Tisdale's Violation.",
            "On podcasts: a lot of Ezra Klein Show and Hard Fork lately.",
            "I keep a running list of books, podcasts, and things I've been watching if you want the full picture 👀",
        ]
    },
    {
        id: 'projects',
        label: "Show me something you've built",
        responses: [
            "Happy to — most of what I build is things I actually wanted to exist.",
            "There's a baby betting pool app, a few data projects, a photo gallery... a mix of practical and just-for-fun.",
            "I'm putting together a proper showcase. Check back soon — or find me on LinkedIn in the meantime.",
        ]
    },
];

const FOLLOWUP = "Anything else you'd like to know?";

// ── DOM ───────────────────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const quickRepliesEl = document.getElementById('quick-replies');
let busy = false;

function scrollDown() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Build message elements ────────────────────────────────────────────────────
function makeRow(side, showAvatar) {
    const row = document.createElement('div');
    row.className = 'message-row' + (side === 'mine' ? ' from-me' : '');
    if (side === 'theirs') {
        const slot = document.createElement('div');
        slot.className = 'avatar-slot';
        if (showAvatar) {
            const img = document.createElement('img');
            img.src = AVATAR;
            img.alt = '';
            slot.appendChild(img);
        }
        row.appendChild(slot);
    }
    return row;
}

function addBubble(content, side, showAvatar = true, isCont = false) {
    const row = makeRow(side, showAvatar);
    if (isCont) row.classList.add('cont');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + side;

    if (content && content.link) {
        const span = document.createElement('span');
        span.textContent = content.text + ' ';
        const a = document.createElement('a');
        a.href = content.href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = content.href.replace('https://www.', '');
        bubble.appendChild(span);
        bubble.appendChild(a);
    } else {
        bubble.textContent = content;
    }

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollDown();
    return row;
}

function addTyping() {
    const row = makeRow('theirs', true);
    const tb = document.createElement('div');
    tb.className = 'typing-bubble';
    tb.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(tb);
    messagesEl.appendChild(row);
    scrollDown();
    return row;
}

// ── Quick replies ─────────────────────────────────────────────────────────────
function showOptions() {
    quickRepliesEl.innerHTML = '';
    TOPICS.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'qr-btn';
        btn.textContent = t.label;
        btn.onclick = () => { if (!busy) handleTopic(t); };
        quickRepliesEl.appendChild(btn);
    });
    quickRepliesEl.style.display = 'flex';
}

function hideOptions() {
    quickRepliesEl.style.display = 'none';
}

// ── Handle topic ──────────────────────────────────────────────────────────────
async function handleTopic(topic) {
    busy = true;
    hideOptions();

    // User bubble
    addBubble(topic.label, 'mine');
    await delay(500);

    // Katherine's responses in sequence
    for (let i = 0; i < topic.responses.length; i++) {
        const typing = addTyping();
        await delay(850 + Math.random() * 350);
        typing.remove();
        // Continuation bubble if not first (avatar only on last)
        const isFirst = i === 0;
        const isLast  = i === topic.responses.length - 1;
        addBubble(topic.responses[i], 'theirs', isLast, !isLast);
        await delay(320);
    }

    // Follow-up
    await delay(600);
    const typing = addTyping();
    await delay(750);
    typing.remove();
    addBubble(FOLLOWUP, 'theirs', false, true);

    await delay(350);
    busy = false;
    showOptions();
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
    await delay(700);
    const typing = addTyping();
    await delay(1100);
    typing.remove();
    addBubble("Hi! 👋 What brings you here today?", 'theirs', true);
    await delay(450);
    showOptions();
}

init();
</script>
</body>
</html>
