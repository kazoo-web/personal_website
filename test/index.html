<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Katherine Ullman</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            background: #FAF8F4;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
        }

        .phone {
            width: 100%;
            max-width: 460px;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Header */
        .chat-header {
            padding: 14px 16px 12px;
            border-bottom: 0.5px solid rgba(0,0,0,0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .header-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            object-fit: cover; object-position: center top;
            background: #ddd;
        }
        .header-name { font-size: 13px; font-weight: 600; color: #2C1A08; }
        .header-sub  { font-size: 11px; color: #B8A898; margin-top: -3px; }

        /* Messages */
        .messages {
            flex: 1;
            padding: 16px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
        }

        /* Extra gap between conversation groups */
        .msg-gap { height: 10px; flex-shrink: 0; }

        .row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .row.mine { flex-direction: row-reverse; }

        .av {
            width: 26px; height: 26px; flex-shrink: 0;
        }
        .av img {
            width: 26px; height: 26px; border-radius: 50%;
            object-fit: cover; object-position: center top;
            display: block; background: #ddd;
        }

        .bubble {
            max-width: 75%;
            padding: 9px 14px;
            font-size: 16px;
            line-height: 1.45;
            word-break: break-word;
        }
        /* First in a run: full tail */
        .bubble.theirs {
            background: #EFE8DC; color: #2C1A08;
            border-radius: 18px 18px 18px 5px;
        }
        /* Continuation (not first): tail side flat */
        .bubble.theirs.cont {
            border-radius: 5px 18px 18px 5px;
        }
        .bubble.mine {
            background: #B86830; color: #fff;
            border-radius: 18px 18px 5px 18px;
        }
        .bubble a { color: inherit; text-decoration: underline; opacity: 0.88; }

        /* Typing dots */
        .typing {
            background: #EFE8DC;
            border-radius: 18px 18px 18px 5px;
            padding: 11px 16px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .dot {
            width: 7px; height: 7px;
            background: #B8A898; border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.18s; }
        .dot:nth-child(3) { animation-delay: 0.36s; }
        @keyframes bounce {
            0%, 55%, 100% { transform: translateY(0); }
            27%            { transform: translateY(-5px); }
        }

        /* Mine continuation */
        .bubble.mine.cont {
            border-radius: 18px 5px 5px 18px;
        }

        /* Y avatar (visitor, right side) */
        .y-av {
            width: 26px; height: 26px; flex-shrink: 0;
            border-radius: 50%;
            background: #B8A898;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }

        /* Options bar — right-aligned ghost pills at the bottom */
        .options-bar {
            padding: 10px 14px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border-top: 0.5px solid rgba(0,0,0,0.06);
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .opt-pill {
            padding: 10px 18px;
            min-height: 44px;
            border-radius: 22px;
            border: 1.5px solid #B86830;
            background: transparent;
            color: #B86830;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .opt-pill:hover  { background: rgba(184,104,48,0.07); }
        .opt-pill:active { background: #B86830; color: #fff; }

        /* Compose bar */
        .compose-bar {
            padding: 10px 14px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border-top: 0.5px solid rgba(0,0,0,0.06);
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .compose-input {
            font-family: inherit;
            font-size: 15px;
            border: 1.5px solid rgba(0,0,0,0.12);
            border-radius: 22px;
            padding: 10px 16px;
            outline: none;
            background: transparent;
            color: #2C1A08;
            width: 100%;
            -webkit-appearance: none;
        }
        .compose-input::placeholder { color: #B8A898; }
        .compose-input:focus { border-color: #B86830; }
        .compose-row { display: flex; gap: 8px; align-items: center; }
        .compose-row .compose-input { flex: 1; }
        .compose-send {
            width: 38px; height: 38px; flex-shrink: 0;
            border-radius: 50%;
            background: #B86830;
            color: #fff;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .compose-send:disabled { opacity: 0.32; cursor: default; }

        /* Image bubbles — uniform square */
        .bubble.img-bubble {
            padding: 0; overflow: hidden;
            width: 210px; height: 210px;
            border-radius: 18px 18px 18px 5px;
        }
        .bubble.img-bubble.cont { border-radius: 5px 18px 18px 5px; }
        .bubble.img-bubble img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }

        /* Stacked photo pair */
        .bubble.img-stack {
            padding: 0; background: transparent; box-shadow: none;
            border-radius: 0;
            position: relative;
            width: 225px; height: 235px;
            overflow: visible;
            margin-top: 10px;
        }
        .bubble.img-stack .stack-img {
            position: absolute;
            width: 195px; height: 195px;
            object-fit: cover; object-position: center top;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.22);
            cursor: pointer;
            transition: opacity 0.12s;
        }
        .bubble.img-stack .stack-img:hover { opacity: 0.88; }
        .bubble.img-stack .stack-img:nth-child(1) { top: 10px; left: 0; transform: rotate(3deg); z-index: 1; }
        .bubble.img-stack .stack-img:nth-child(2) { top: 28px; left: 18px; transform: rotate(-1.5deg); z-index: 2; }

        /* Emoji-only bubble (like iMessage large emoji) */
        .bubble.emoji-only {
            background: transparent !important;
            box-shadow: none;
            padding: 2px 4px;
            font-size: 44px;
            line-height: 1;
        }

        /* Tapback reaction attached to a mine bubble */
        .bubble.mine { position: relative; overflow: visible; }
        .tapback {
            position: absolute;
            top: -16px; left: -16px;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #fff;
            border: 1.5px solid rgba(0,0,0,0.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.16);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            z-index: 2;
            transform: scale(0);
            transform-origin: bottom right;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .tapback.show { transform: scale(1); }

        /* Clickable single image */
        .bubble.img-bubble img { cursor: pointer; transition: opacity 0.12s; }
        .bubble.img-bubble img:hover { opacity: 0.88; }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            cursor: pointer;
            padding: 24px;
        }
        .lightbox img {
            max-width: 100%; max-height: 88vh;
            border-radius: 14px;
            object-fit: contain;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .lightbox-close {
            position: fixed; top: 18px; right: 18px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            border: none; color: #fff;
            font-size: 20px; line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1001;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
<div class="phone">

    <header class="chat-header">
        <img src="../headshot.png" alt="KU" class="header-avatar">
        <div class="header-name">Katherine Ullman</div>
        <div class="header-sub">welcome to my little corner of the internet</div>
    </header>

    <div class="messages" id="messages">
        <div class="row">
            <div class="av" style="visibility:hidden"><img src="../headshot.png" alt=""></div>
            <div class="bubble theirs">Hi! I'm Katherine</div>
        </div>
        <div class="row">
            <div class="av" style="visibility:hidden"><img src="../headshot.png" alt=""></div>
            <div class="bubble theirs cont">I love building the systems and tools that make organizations work.</div>
        </div>
        <div class="row">
            <div class="av"><img src="../headshot.png" alt=""></div>
            <div class="bubble theirs cont">What would you like to know?</div>
        </div>
    </div>

    <div class="compose-bar" id="compose-bar" hidden>
        <input type="email" id="compose-email" class="compose-input" placeholder="Your email address" autocomplete="email">
        <div class="compose-row">
            <input type="text" id="compose-msg" class="compose-input" placeholder="Your message…" autocomplete="off">
            <button class="compose-send" id="compose-send" disabled aria-label="Send">&#8593;</button>
        </div>
    </div>

    <div class="options-bar" id="options-bar"></div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#x2715;</button>
    <img id="lightbox-img" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init('W-xleQle2O_YXo0w6');

// Lightbox
var lightbox      = document.getElementById('lightbox');
var lightboxImg   = document.getElementById('lightbox-img');
var lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.hidden = false;
}
function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.src = '';
}
lightbox.addEventListener('click', closeLightbox);
lightboxClose.addEventListener('click', function(e) { e.stopPropagation(); closeLightbox(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

var AVATAR      = '../headshot.png';
var msgs        = document.getElementById('messages');
var optBar      = document.getElementById('options-bar');
var composeBar  = document.getElementById('compose-bar');
var composeEmail = document.getElementById('compose-email');
var composeMsg  = document.getElementById('compose-msg');
var composeSend = document.getElementById('compose-send');
var busy        = false;

// Auto-scroll: follow new messages unless user has scrolled up
var autoScroll  = true;
var progScroll  = false;
msgs.addEventListener('scroll', function() {
    if (progScroll) return;
    autoScroll = (msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight) < 60;
});
function scrollToEl() {
    if (!autoScroll) return;
    progScroll = true;
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(function() { progScroll = false; }, 100);
}

// Typing delay scales with message length (like a real text)
function typingDelay(content) {
    if (!content || typeof content !== 'string') return 1100;
    return Math.min(2600, Math.max(640, Math.round(content.length * 16)));
}

function validateCompose() {
    var hasEmail = composeEmail.value.trim().indexOf('@') > 0;
    var hasMsg   = composeMsg.value.trim().length > 0;
    composeSend.disabled = !(hasEmail && hasMsg);
}
composeEmail.addEventListener('input', validateCompose);
composeMsg.addEventListener('input', validateCompose);

composeMsg.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !composeSend.disabled) { e.preventDefault(); doSend(); }
});
composeSend.addEventListener('click', function() { if (!composeSend.disabled) doSend(); });

function showCompose() {
    composeBar.hidden = false;
    composeEmail.value = '';
    composeMsg.value = '';
    composeSend.disabled = true;
    setTimeout(function() { composeEmail.focus(); }, 80);
}

function hideCompose() {
    composeBar.hidden = true;
}

function doSend() {
    var email = composeEmail.value.trim();
    var message = composeMsg.value.trim();
    if (!email || !message) return;

    hideCompose();
    addBubble(message, 'mine', true, false);

    emailjs.send('service_rsar3li', 'template_fvgjjpd', {
        visitor_email: email,
        visitor_message: message
    });

    setTimeout(function() {
        var tr = addTyping();
        setTimeout(function() {
            tr.remove();
            addBubble("Thanks — I'll follow up soon. 🙏", 'theirs', true, false);
            busy = false;
        }, 1100);
    }, 400);
}

var TOPICS = [
    {
        id: 'about',
        label: 'Who are you?',
        responses: [
            "I grew up in families of artists and scientists, which probably explains why I get as excited about bringing a data and technical lens (the hard stuff) to questions of how best to organize people (the soft stuff).",
            "I'm trained as a quantitative organizational sociologist. I started a PhD at UC Berkeley's Haas before leaving to bring scientific insight directly to companies.",
            "I spent five years at Paradigm leading a people analytics team, helping companies big and small leverage their data to build better people practices. There I also built products and internal tools to assess people programs.",
            "Most recently, I was at Electrified Thermal Solutions, a climate tech startup. I started as a consultant, and, within a few months, joined full-time as their first operational leader. From Seed through Series A, I led people, recruiting, finance, and org strategy, among other things, doubling the team, bringing in $10M+ in non-dilutive funding, and breaking ground on a pilot manufacturing facility."
        ]
    },
    {
        id: 'built',
        label: "Tell me more about what you've built.",
        responses: [
            "I build systems, processes, and tools.",
            "Most recently, I built the people, recruiting and finance functions for a climate tech startup. But I've also built some products and internal tools I'm very proud of.",
            "One example is Blueprint — v1 of a people programs assessment platform I designed and launched at Paradigm.",
            "It turned our services team's expertise into a product. That year the team had its first profitable year (+$1.2M in revenue), and the firm shifted to a product-first strategy.",
            "I set the product development and the external development team that built it. Check it out.",
            {image: "img/blueprint.webp", alt: "Blueprint platform"},
            "Another example was a Training Impact Dashboard — an internal system for collecting and analyzing data to measure whether the employee trainings we ran actually changed how people exercise judgment and make decisions. We shared the results with clients, used them to improve our curriculum, and they became the basis for follow-on work. I built v1 myself and ultimately hired and led developers to support."
        ]
    },
    {
        id: 'building',
        label: "What are you building now?",
        responses: [
            "I'm currently building a tool that turns a job description into a complete, structured hiring plan — an interview plan, and the questions and rubrics to run it — so startups can make fast and rigorous hiring decisions.",
            {image: "img/signalhire.png", alt: "Signal Kit", objectPosition: "center top"},
            "I've also built a few things for fun: a baby betting pool and a digital holiday card. Check them out.",
            {images: [{src: "img/baby-betting-pool.webp", alt: "Baby betting pool"}, {src: "img/holiday-card.webp", alt: "Digital holiday card"}]},
            "Oh, and I've built this website!"
        ]
    },
    {
        id: 'looking',
        label: "What are you looking for?",
        responses: [
            "I'm looking for my next full-time role. The title matters less to me than the work — I'm open to roles across people & talent, operations, and product.",
            "What matters is three things: (1) getting to build systems, processes, and tools, (2) leveraging data, and (3) projects that are fundamentally about improving how people work together.",
            "That might be leading people systems at a growing company, serving as chief of staff to a leader who cares how their organization runs, or working on a product where people and/or collaboration are the point."
        ]
    },
    {
        id: 'contact',
        label: "How can I get in touch?",
        compose: true,
        responses: [
            {emoji: "🧡", tapback: true},
            "A few ways!",
            {link: "https://www.linkedin.com/in/katherineullman/", text: "Connect with me on LinkedIn →"}
        ]
    }
];

function makeAvEl(visible) {
    var av = document.createElement('div');
    av.className = 'av';
    var img = document.createElement('img');
    img.src = AVATAR; img.alt = '';
    av.appendChild(img);
    if (!visible) av.style.visibility = 'hidden';
    return av;
}

function addBubble(content, side, showAv, isCont) {
    var row = document.createElement('div');
    row.className = 'row' + (side === 'mine' ? ' mine' : '');

    if (side === 'theirs') {
        row.appendChild(makeAvEl(!!showAv));
    } else if (side === 'mine' && showAv) {
        // row-reverse: first child lands on far right
        var yav = document.createElement('div');
        yav.className = 'y-av';
        yav.textContent = 'Y';
        row.appendChild(yav);
    }

    var b = document.createElement('div');
    b.className = 'bubble ' + (side === 'mine' ? 'mine' : 'theirs');
    if (isCont) b.classList.add('cont');

    if (content && typeof content === 'object' && content.emoji) {
        b.classList.add('emoji-only');
        b.textContent = content.emoji;
    } else if (content && typeof content === 'object' && content.images) {
        b.classList.add('img-stack');
        content.images.forEach(function(imgData) {
            var im = document.createElement('img');
            im.src = imgData.src; im.alt = imgData.alt || '';
            im.className = 'stack-img';
            im.addEventListener('click', (function(s, a) {
                return function(e) { e.stopPropagation(); openLightbox(s, a); };
            })(imgData.src, imgData.alt || ''));
            b.appendChild(im);
        });
    } else if (content && typeof content === 'object' && content.image) {
        b.classList.add('img-bubble');
        var im = document.createElement('img');
        im.src = content.image; im.alt = content.alt || '';
        if (content.objectPosition) im.style.objectPosition = content.objectPosition;
        im.addEventListener('click', (function(s, a) {
            return function() { openLightbox(s, a); };
        })(content.image, content.alt || ''));
        b.appendChild(im);
    } else if (content && typeof content === 'object' && content.link) {
        var a = document.createElement('a');
        a.href = content.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = content.text;
        b.appendChild(a);
    } else {
        b.textContent = content;
    }

    row.appendChild(b);
    msgs.appendChild(row);
    scrollToEl();
    return row;
}

function addTyping() {
    var row = document.createElement('div');
    row.className = 'row';
    row.appendChild(makeAvEl(true));
    var t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(t);
    msgs.appendChild(row);
    scrollToEl();
    return row;
}

function showOptions() {
    optBar.innerHTML = '';
    optBar.hidden = false;
    TOPICS.forEach(function(t) {
        var btn = document.createElement('button');
        btn.className = 'opt-pill';
        btn.textContent = t.label;
        btn.addEventListener('click', function() { handleTopic(t); });
        optBar.appendChild(btn);
    });
}

function clearOptions() {
    optBar.hidden = true;
    optBar.innerHTML = '';
}

function addTapback(emoji) {
    var rows = msgs.querySelectorAll('.row.mine');
    if (!rows.length) return;
    var mineRow = rows[rows.length - 1];
    mineRow.style.marginTop = '18px';
    var bubble = mineRow.querySelector('.bubble.mine');
    if (!bubble) return;
    var tb = document.createElement('div');
    tb.className = 'tapback';
    tb.textContent = emoji;
    bubble.appendChild(tb);
    requestAnimationFrame(function() {
        requestAnimationFrame(function() { tb.classList.add('show'); });
    });
    scrollToEl();
}

function playResponses(responses, idx, done) {
    if (idx >= responses.length) { done(); return; }
    var content = responses[idx];

    if (content && typeof content === 'object' && content.tapback) {
        setTimeout(function() {
            addTapback(content.emoji);
            setTimeout(function() { playResponses(responses, idx + 1, done); }, 500);
        }, 400);
        return;
    }

    // Count only non-tapback responses before this index for isCont
    var theirsBefore = responses.slice(0, idx).filter(function(r) {
        return !(r && typeof r === 'object' && r.tapback);
    }).length;

    var delay = typingDelay(typeof content === 'string' ? content : null) + Math.floor(Math.random() * 160);
    var tr = addTyping();
    setTimeout(function() {
        tr.remove();
        addBubble(content, 'theirs', false, theirsBefore > 0);
        setTimeout(function() { playResponses(responses, idx + 1, done); }, 300);
    }, delay);
}

function handleTopic(topic) {
    if (busy) return;
    busy = true;
    clearOptions();
    hideCompose();

    addBubble(topic.label, 'mine', true, false);

    setTimeout(function() {
        playResponses(topic.responses, 0, function() {
            if (topic.compose) {
                setTimeout(function() {
                    var tr = addTyping();
                    setTimeout(function() {
                        tr.remove();
                        addBubble("Or send me a note here and I'll follow up:", 'theirs', true, false);
                        setTimeout(function() {
                            showCompose();
                            busy = false;
                            showOptions();
                        }, 350);
                    }, 750);
                }, 600);
            } else {
                setTimeout(function() {
                    var tr = addTyping();
                    setTimeout(function() {
                        tr.remove();
                        addBubble("Anything else you'd like to know?", 'theirs', true, false);
                        setTimeout(function() {
                            busy = false;
                            showOptions();
                        }, 350);
                    }, 750);
                }, 600);
            }
        });
    }, 500);
}

showOptions();
</script>
</body>
</html>
