<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katherine Ullman — Operations & People Strategy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Index page: center hero, no flex-direction column */
        .main {
            align-items: center;
            padding: 140px 40px 60px 40px;
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 80px;
            max-width: 1000px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1.15;
            color: var(--charcoal);
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .hero-text h1 span {
            display: block;
            font-weight: 500;
            color: var(--coral);
        }

        .hero-tagline {
            font-size: 1.1rem;
            color: var(--warm-gray);
            max-width: 380px;
            margin-bottom: 32px;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background-color: var(--coral);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .hero-cta:hover {
            background-color: var(--coral-deep);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 135, 124, 0.35);
        }

        .hero-cta svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .hero-cta:hover svg {
            transform: translateX(4px);
        }

        /* Headshot */
        .hero-visual {
            position: relative;
            flex-shrink: 0;
        }

        .headshot-container {
            position: relative;
            width: 320px;
            height: 400px;
        }

        .headshot-frame {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, var(--coral-pink) 0%, var(--coral) 100%);
            border-radius: 180px 180px 100px 100px;
        }

        .headshot-frame-2 {
            position: absolute;
            top: -12px;
            left: -12px;
            width: calc(100% + 24px);
            height: calc(100% + 24px);
            border: 1.5px solid var(--slate-light);
            border-radius: 190px 190px 110px 110px;
            opacity: 0.4;
        }

        .headshot-img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            border-radius: 180px 180px 100px 100px;
            z-index: 1;
        }

        .headshot-accent {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1.5px solid var(--slate);
            border-radius: 50%;
            top: -24px;
            right: -24px;
            opacity: 0.5;
        }

        .headshot-accent-2 {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: var(--coral-pink);
            border-radius: 50%;
            bottom: 60px;
            left: -40px;
        }

        .headshot-accent-3 {
            position: absolute;
            width: 80px;
            height: 40px;
            border: 1.5px solid var(--coral);
            border-radius: 40px;
            bottom: -20px;
            right: 40px;
            opacity: 0.5;
        }

        @media (max-width: 900px) {
            .main {
                padding: 150px 24px 60px 24px;
            }

            .hero {
                flex-direction: column-reverse;
                gap: 40px;
                text-align: center;
            }

            .hero-tagline {
                margin-left: auto;
                margin-right: auto;
            }

            .headshot-container {
                width: 240px;
                height: 300px;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 500px) {
            .main {
                padding: 160px 24px 60px 24px;
            }

            .hero-text h1 {
                font-size: 2rem;
            }

            .headshot-container {
                width: 200px;
                height: 250px;
            }

            .headshot-accent,
            .headshot-accent-2,
            .headshot-accent-3,
            .headshot-frame-2 {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Background texture elements -->
    <div class="bg-texture bg-blob-1"></div>
    <div class="bg-texture bg-blob-2"></div>

    <!-- Top Center Navigation -->
    <nav class="nav-top">
        <a href="../about.html">About</a>
        <a href="../consulting.html">Consulting</a>
        <a href="../projects.html">Projects</a>

    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="hero">
            <div class="hero-text">
                <h1>
                    Hi, I'm
                    <span>Katherine.</span>
                </h1>
                <p class="hero-tagline">Welcome to my own little corner of the internet. Let's get to know each other.</p>
            </div>
            <div class="hero-visual">
                <div class="headshot-container">
                    <div class="headshot-frame"></div>
                    <div class="headshot-frame-2"></div>
                    <img src="../headshot.png" alt="Katherine Ullman" class="headshot-img">
                    <div class="headshot-accent"></div>
                    <div class="headshot-accent-2"></div>
                    <div class="headshot-accent-3"></div>
                </div>
            </div>
        </div>
    </main>
