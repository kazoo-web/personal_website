<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Katherine Ullman</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            background: #FAF8F4;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
        }

        .phone {
            width: 100%;
            max-width: 460px;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Header */
        .chat-header {
            padding: 14px 16px 12px;
            border-bottom: 0.5px solid rgba(0,0,0,0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .header-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            object-fit: cover; object-position: center top;
            background: #ddd;
        }
        .header-name { font-size: 13px; font-weight: 600; color: #2C1A08; }
        .header-sub  { font-size: 11px; color: #B8A898; margin-top: -3px; }

        /* Messages */
        .messages {
            flex: 1;
            padding: 16px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
        }

        /* Extra gap between conversation groups */
        .msg-gap { height: 10px; flex-shrink: 0; }

        .row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .row.mine { flex-direction: row-reverse; }

        .av {
            width: 26px; height: 26px; flex-shrink: 0;
        }
        .av img {
            width: 26px; height: 26px; border-radius: 50%;
            object-fit: cover; object-position: center top;
            display: block; background: #ddd;
        }

        .bubble {
            max-width: 75%;
            padding: 9px 14px;
            font-size: 16px;
            line-height: 1.45;
            word-break: break-word;
        }
        /* First in a run: full tail */
        .bubble.theirs {
            background: #EFE8DC; color: #2C1A08;
            border-radius: 18px 18px 18px 5px;
        }
        /* Continuation (not first): tail side flat */
        .bubble.theirs.cont {
            border-radius: 5px 18px 18px 5px;
        }
        .bubble.mine {
            background: #B86830; color: #fff;
            border-radius: 18px 18px 5px 18px;
        }
        .bubble a { color: inherit; text-decoration: underline; opacity: 0.88; }

        /* Typing dots */
        .typing {
            background: #EFE8DC;
            border-radius: 18px 18px 18px 5px;
            padding: 11px 16px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .dot {
            width: 7px; height: 7px;
            background: #B8A898; border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.18s; }
        .dot:nth-child(3) { animation-delay: 0.36s; }
        @keyframes bounce {
            0%, 55%, 100% { transform: translateY(0); }
            27%            { transform: translateY(-5px); }
        }

        /* Mine continuation */
        .bubble.mine.cont {
            border-radius: 18px 5px 5px 18px;
        }

        /* Y avatar (visitor, right side) */
        .y-av {
            width: 26px; height: 26px; flex-shrink: 0;
            border-radius: 50%;
            background: #B8A898;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }

        /* Options bar — right-aligned ghost pills at the bottom */
        .options-bar {
            padding: 10px 14px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border-top: 0.5px solid rgba(0,0,0,0.06);
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        .opt-pill {
            padding: 10px 18px;
            min-height: 44px;
            border-radius: 22px;
            border: 1.5px solid #B86830;
            background: transparent;
            color: #B86830;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .opt-pill:hover  { background: rgba(184,104,48,0.07); }
        .opt-pill:active { background: #B86830; color: #fff; }

        /* Compose bar */
        .compose-bar {
            padding: 10px 14px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border-top: 0.5px solid rgba(0,0,0,0.06);
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .compose-input {
            font-family: inherit;
            font-size: 15px;
            border: 1.5px solid rgba(0,0,0,0.12);
            border-radius: 22px;
            padding: 10px 16px;
            outline: none;
            background: transparent;
            color: #2C1A08;
            width: 100%;
            -webkit-appearance: none;
        }
        .compose-input::placeholder { color: #B8A898; }
        .compose-input:focus { border-color: #B86830; }
        .compose-row { display: flex; gap: 8px; align-items: center; }
        .compose-row .compose-input { flex: 1; }
        .compose-send {
            width: 38px; height: 38px; flex-shrink: 0;
            border-radius: 50%;
            background: #B86830;
            color: #fff;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .compose-send:disabled { opacity: 0.32; cursor: default; }
    </style>
</head>
<body>
<div class="phone">

    <header class="chat-header">
        <img src="../headshot.png" alt="KU" class="header-avatar">
        <div class="header-name">Katherine Ullman</div>
        <div class="header-sub">Operations &amp; People Strategy</div>
    </header>

    <div class="messages" id="messages">
        <div class="row">
            <div class="av"><img src="../headshot.png" alt=""></div>
            <div class="bubble theirs">Hi! 👋 What brings you here today?</div>
        </div>
    </div>

    <div class="options-bar" id="options-bar"></div>

    <div class="compose-bar" id="compose-bar" hidden>
        <input type="email" id="compose-email" class="compose-input" placeholder="Your email address" autocomplete="email">
        <div class="compose-row">
            <input type="text" id="compose-msg" class="compose-input" placeholder="Your message…" autocomplete="off">
            <button class="compose-send" id="compose-send" disabled aria-label="Send">&#8593;</button>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init('W-xleQle2O_YXo0w6');

var AVATAR      = '../headshot.png';
var msgs        = document.getElementById('messages');
var optBar      = document.getElementById('options-bar');
var composeBar  = document.getElementById('compose-bar');
var composeEmail = document.getElementById('compose-email');
var composeMsg  = document.getElementById('compose-msg');
var composeSend = document.getElementById('compose-send');
var busy        = false;

function validateCompose() {
    var hasEmail = composeEmail.value.trim().indexOf('@') > 0;
    var hasMsg   = composeMsg.value.trim().length > 0;
    composeSend.disabled = !(hasEmail && hasMsg);
}
composeEmail.addEventListener('input', validateCompose);
composeMsg.addEventListener('input', validateCompose);

composeMsg.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !composeSend.disabled) { e.preventDefault(); doSend(); }
});

function showCompose() {
    composeBar.hidden = false;
    composeEmail.value = '';
    composeMsg.value = '';
    composeSend.disabled = true;
    setTimeout(function() { composeEmail.focus(); }, 80);
}

function hideCompose() {
    composeBar.hidden = true;
}

function doSend() {
    var email = composeEmail.value.trim();
    var message = composeMsg.value.trim();
    if (!email || !message) return;

    hideCompose();
    addBubble(message, 'mine', true, false);
    msgs.scrollTop = msgs.scrollHeight;

    emailjs.send('service_rsar3li', 'template_fvgjjpd', {
        visitor_email: email,
        visitor_message: message
    });

    setTimeout(function() {
        var tr = addTyping();
        setTimeout(function() {
            tr.remove();
            addBubble("Thanks — I'll follow up soon. 🙏", 'theirs', false, false);
            setTimeout(function() {
                var tr2 = addTyping();
                setTimeout(function() {
                    tr2.remove();
                    addBubble("Anything else you'd like to know?", 'theirs', true, false);
                    setTimeout(function() {
                        busy = false;
                        showOptions();
                    }, 350);
                }, 750);
            }, 600);
        }, 1100);
    }, 400);
}

var TOPICS = [
    {
        id: 'about',
        label: 'Who are you?',
        responses: [
            "I grew up between families of artists and scientists — which probably explains why I get as excited about a well-crafted sentence as a well-structured decision.",
            "My work is about building organizations that actually work. Not in theory — under pressure, with real constraints, across people who don't always agree.",
            "Most recently VP of Operations at Electrified Thermal Solutions, a climate tech startup. Before that, five years at Paradigm, a strategy consulting firm.",
            "My academic background is in organizational sociology — I started a PhD at UC Berkeley's Haas before leaving to do the work directly."
        ]
    },
    {
        id: 'work',
        label: 'What kind of work do you do?',
        responses: [
            "I work at the intersection of organizational design, people strategy, and operations.",
            "The core question I keep returning to: how do we build organizations that actually work toward their missions?",
            "Lately that's meant working with mission-driven orgs navigating growth phases, team design, operating rhythms, that kind of thing."
        ]
    },
    {
        id: 'together',
        label: "I'd like to work with you",
        responses: [
            "I'm glad to hear it — I'm selectively available for consulting with mission-driven organizations.",
            "I focus on org design, people strategy, and operational infrastructure, especially during growth or transition.",
            {link: "https://www.linkedin.com/in/katherineullman/", text: "Best way to reach me is on LinkedIn →"}
        ]
    },
    {
        id: 'reading',
        label: 'What are you reading?',
        responses: [
            "Right now: Flesh by David Szalay — it just won the Booker Prize and absolutely deserved it.",
            "Also working through Rachel Cusk's Coventry and Sallie Tisdale's Violation.",
            "On podcasts: a lot of Ezra Klein Show and Hard Fork lately."
        ]
    },
    {
        id: 'projects',
        label: "Show me something you've built",
        responses: [
            "Happy to — most of what I build is things I actually wanted to exist.",
            "There's a baby betting pool app, a few data projects, a photo gallery... a mix of practical and just-for-fun.",
            "I'm putting together a proper showcase. Check back soon — or find me on LinkedIn in the meantime."
        ]
    }
];

function makeAvEl(visible) {
    var av = document.createElement('div');
    av.className = 'av';
    var img = document.createElement('img');
    img.src = AVATAR; img.alt = '';
    av.appendChild(img);
    if (!visible) av.style.visibility = 'hidden';
    return av;
}

function addBubble(content, side, showAv, isCont) {
    var row = document.createElement('div');
    row.className = 'row' + (side === 'mine' ? ' mine' : '');

    if (side === 'theirs') {
        row.appendChild(makeAvEl(!!showAv));
    } else if (side === 'mine' && showAv) {
        // row-reverse: first child lands on far right
        var yav = document.createElement('div');
        yav.className = 'y-av';
        yav.textContent = 'Y';
        row.appendChild(yav);
    }

    var b = document.createElement('div');
    b.className = 'bubble ' + (side === 'mine' ? 'mine' : 'theirs');
    if (isCont) b.classList.add('cont');

    if (content && typeof content === 'object' && content.link) {
        var a = document.createElement('a');
        a.href = content.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = content.text;
        b.appendChild(a);
    } else {
        b.textContent = content;
    }

    row.appendChild(b);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
}

function addTyping() {
    var row = document.createElement('div');
    row.className = 'row';
    row.appendChild(makeAvEl(true));
    var t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(t);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
}

function showOptions() {
    optBar.innerHTML = '';
    optBar.hidden = false;
    TOPICS.forEach(function(t) {
        var btn = document.createElement('button');
        btn.className = 'opt-pill';
        btn.textContent = t.label;
        btn.addEventListener('click', function() { handleTopic(t); });
        optBar.appendChild(btn);
    });
}

function clearOptions() {
    optBar.hidden = true;
    optBar.innerHTML = '';
}

function playResponses(responses, idx, done) {
    if (idx >= responses.length) { done(); return; }
    var tr = addTyping();
    setTimeout(function() {
        tr.remove();
        addBubble(responses[idx], 'theirs', false, idx > 0);
        setTimeout(function() { playResponses(responses, idx + 1, done); }, 320);
    }, 880 + Math.floor(Math.random() * 280));
}

function handleTopic(topic) {
    if (busy) return;
    busy = true;
    clearOptions();

    addBubble(topic.label, 'mine', true, false);
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(function() {
        playResponses(topic.responses, 0, function() {
            if (topic.id === 'together') {
                setTimeout(function() {
                    var tr = addTyping();
                    setTimeout(function() {
                        tr.remove();
                        addBubble("Send me a note here and I'll follow up:", 'theirs', true, false);
                        setTimeout(function() { showCompose(); }, 350);
                    }, 750);
                }, 600);
            } else {
                setTimeout(function() {
                    var tr = addTyping();
                    setTimeout(function() {
                        tr.remove();
                        addBubble("Anything else you'd like to know?", 'theirs', true, false);
                        setTimeout(function() {
                            busy = false;
                            showOptions();
                        }, 350);
                    }, 750);
                }, 600);
            }
        });
    }, 500);
}

showOptions();
</script>
</body>
</html>
