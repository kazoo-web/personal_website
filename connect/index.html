    <style>
        /* Contact Form */
        .contact-form {
            width: 100%;
            max-width: 450px;
            margin: 20px auto 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--slate-deep);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--cream-dark);
            border-radius: 12px;
            background: var(--cream-dark);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            color: var(--charcoal);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--coral);
            background: white;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 32px;
            background: var(--coral);
            border: none;
            border-radius: 50px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: var(--coral-deep);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 135, 124, 0.35);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--warm-gray);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--cream-dark);
        }

        /* Contact Links */
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            background: var(--cream-dark);
            border: 1.5px solid transparent;
            border-radius: 60px;
            text-decoration: none;
            color: var(--slate-deep);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .contact-link:hover {
            background: var(--slate);
            color: var(--cream);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(74, 102, 112, 0.2);
        }

        .contact-link svg {
            flex-shrink: 0;
        }

        @media (max-width: 500px) {
            .contact-link {
                padding: 16px 28px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
