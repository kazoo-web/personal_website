<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katherine Ullman — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #C1DCE8;
            --cream-dark: #B0CDD8;
            --slate: #F5F2ED;
            --slate-deep: #E0DDD8;
            --slate-light: #FAF8F5;
            --coral: #810C1C;
            --coral-deep: #6A0A17;
            --coral-pink: #A83040;
            --blush: #E0C4C8;
            --charcoal: #2D3436;
            --warm-gray: #6B6560;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            line-height: 1.7;
            font-size: 16px;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 1000;
        }

        .bg-texture {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        .bg-blob-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(ellipse, var(--slate) 0%, transparent 70%);
            opacity: 0.06;
            top: -200px;
            right: -100px;
            border-radius: 50%;
        }

        .bg-blob-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse, var(--coral-pink) 0%, transparent 70%);
            opacity: 0.08;
            bottom: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            position: relative;
            z-index: 1;
        }

        .construction-content {
            text-align: center;
            max-width: 560px;
        }

        .construction-icon {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 48px;
        }

        .icon-shape {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, var(--coral-pink) 0%, var(--coral) 100%);
            border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-shape svg {
            width: 52px;
            height: 52px;
            stroke: white;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-accent {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 1.5px solid var(--slate);
            border-radius: 50%;
            top: -16px;
            right: -20px;
            opacity: 0.4;
        }

        .icon-accent-2 {
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: var(--coral-pink);
            border-radius: 50%;
            bottom: -4px;
            left: -16px;
        }

        .construction-content h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 300;
            line-height: 1.15;
            color: var(--charcoal);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .construction-content h1 span {
            font-weight: 500;
            color: var(--coral);
        }

        .construction-subtitle {
            font-size: 1.15rem;
            color: var(--warm-gray);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--coral-pink), var(--coral));
            border-radius: 2px;
            margin: 0 auto 40px;
        }

        .construction-note {
            font-size: 0.95rem;
            color: var(--warm-gray);
            margin-bottom: 32px;
        }

        .construction-cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background-color: var(--coral);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .construction-cta:hover {
            background-color: var(--coral-deep);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(129, 12, 28, 0.35);
        }

        .construction-cta svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .construction-cta:hover svg {
            transform: translateX(4px);
        }

        footer {
            padding: 24px 40px;
            background: var(--slate-deep);
            position: relative;
            z-index: 1;
        }

        footer .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        footer p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        footer .footer-links {
            display: flex;
            gap: 24px;
        }

        footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--coral-pink);
        }

        @media (max-width: 900px) {
            .main {
                padding: 60px 24px;
            }

            .construction-content h1 {
                font-size: 2.5rem;
            }

            footer {
                padding: 24px;
            }

            footer .footer-content {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
        }

        @media (max-width: 500px) {
            .main {
                padding: 48px 24px;
            }

            .construction-content h1 {
                font-size: 2rem;
            }

            .construction-icon {
                width: 96px;
                height: 96px;
                margin-bottom: 36px;
            }

            .icon-shape {
                width: 96px;
                height: 96px;
            }

            .icon-shape svg {
                width: 40px;
                height: 40px;
            }

            .icon-accent,
            .icon-accent-2 {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-texture bg-blob-1"></div>
    <div class="bg-texture bg-blob-2"></div>

    <main class="main">
        <div class="construction-content">
            <div class="construction-icon">
                <div class="icon-shape">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                </div>
                <div class="icon-accent"></div>
                <div class="icon-accent-2"></div>
            </div>

            <h1>
                Something lovely is
                <span>on its way.</span>
            </h1>

            <p class="construction-subtitle">
                I'm building my own little corner of the internet. Check back soon to explore what I've been working on.
            </p>

            <div class="divider"></div>

            <p class="construction-note">
                In the meantime, let's connect.
            </p>

            <a href="https://www.linkedin.com/in/katherineullman/" target="_blank" class="construction-cta">
                Find me on LinkedIn
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Katherine Ullman</p>
            <div class="footer-links">
                <a href="https://www.linkedin.com/in/katherineullman/" target="_blank" aria-label="LinkedIn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
